services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: voz_urbana
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no ambiente ou no .env da raiz}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h localhost -uroot"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
